<style>
  /* Цвета — как на основном сайте (../index.html) */
  :root{
    --bg:#f7f3ec; --panel:#fff; --panel-2:#f4efe6; --line:#e3dacb;
    --ink:#15262d; --muted:#56676e; --accent:#1d4b57; --accent-2:#2f6b78; --warm:#e9774c;
    --good:#2f9e6e; --mid:#e0a332; --bad:#e06a4f; --radius:18px;
  }

  .top{position:sticky;top:0;z-index:5;background:rgba(247,243,236,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top .in{max-width:640px;margin:0 auto;padding:0 18px;height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .home{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
  .home i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-style:normal;font-size:12px}
  .lang{display:flex;background:var(--panel-2);border-radius:999px;padding:3px}
  .lang button{border:0;background:none;font:600 13px Rubik,sans-serif;color:var(--muted);padding:6px 11px;border-radius:999px;cursor:pointer}
  .lang button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 64px}
  h1{font-size:30px;line-height:1.2;margin:0 0 12px;letter-spacing:-.01em}
  h2{font-size:20px;margin:0 0 10px}
  p{margin:0 0 14px;color:var(--muted)}
  .lede{color:var(--ink);font-size:18px}
  .card{background:var(--panel);border-radius:var(--radius);padding:24px;margin:0 0 16px;box-shadow:0 8px 26px rgba(21,38,45,.07)}
  .pill{display:inline-block;font-size:13px;font-weight:500;color:var(--accent-2);background:#e3eef0;
    border-radius:999px;padding:4px 12px;margin-bottom:14px}
  .q-prompt{font-size:19px;font-weight:500;color:var(--ink);margin:2px 0 16px;line-height:1.4}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:block;width:100%;text-align:start;background:var(--panel-2);
    border:2px solid transparent;color:var(--ink);border-radius:14px;padding:14px 16px;
    font:16px Rubik,sans-serif;cursor:pointer;transition:.12s border-color,.12s background}
  .opt:hover{border-color:var(--accent-2);background:#fff}
  .opt:active{background:#e3eef0}
  .btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:999px;
    padding:14px 24px;font:600 16px Rubik,sans-serif;cursor:pointer;transition:.12s background;text-decoration:none}
  .btn:hover{background:var(--accent-2)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:transparent;border:2px solid var(--line);color:var(--muted);font-weight:500}
  .btn-ghost:hover{background:transparent;border-color:var(--accent-2);color:var(--ink)}
  .btn-wa{background:#1fa855}
  .btn-wa:hover{background:#178f47}
  .btn-tg{background:#2a9fd8}
  .btn-tg:hover{background:#1f8bc0}
  .back{background:none;border:0;color:var(--muted);font:500 15px Rubik,sans-serif;cursor:pointer;padding:4px 0;margin:0 0 10px}
  .back:hover{color:var(--ink)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:0 0 22px}
  .progress > i{display:block;height:100%;background:var(--warm);width:0;transition:.25s width}
  .scale{display:flex;gap:8px;flex-wrap:wrap}
  .scale .opt{flex:1;min-width:120px;text-align:center}
  .listen{font-size:14px;font-weight:600;color:var(--accent-2);margin:0 0 4px}
  audio{width:100%;margin:6px 0 14px}
  .hint-btn{background:none;border:none;color:var(--accent-2);font:500 14px Rubik,sans-serif;cursor:pointer;padding:0;margin:0 0 12px;display:inline-block;text-decoration:underline}
  .hint{background:#fdf3ec;border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:15px;color:var(--ink);line-height:1.45}
  /* результат */
  .bars{display:flex;flex-direction:column;gap:12px;margin:6px 0 4px}
  .bar-row{display:grid;grid-template-columns:1fr;gap:6px}
  .bar-label{display:flex;justify-content:space-between;font-size:15px}
  .bar-label .st{color:var(--muted)}
  .bar{height:10px;background:var(--panel-2);border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:999px}
  .st-strong > i{background:var(--good)} .st-medium > i{background:var(--mid)}
  .st-weak > i{background:var(--bad)}  .st-unchecked > i{background:#d9d1c3}
  .locked{position:relative}
  .locked .blur{filter:blur(6px);opacity:.6;pointer-events:none;user-select:none}
  .lock-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:500;color:var(--ink)}
  .verdict{font-size:20px;font-weight:500;color:var(--ink);line-height:1.4;margin:0 0 8px}
  .field{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
  .field label{font-size:14px;color:var(--muted)}
  input,select{background:var(--panel-2);border:2px solid transparent;color:var(--ink);
    border-radius:12px;padding:12px 14px;font:16px Rubik,sans-serif;width:100%}
  input:focus,select:focus{outline:none;border-color:var(--accent-2);background:#fff}
  .prio{background:var(--panel-2);border-radius:12px;padding:14px 16px;margin:0 0 10px}
  .prio b{color:var(--ink)}
  .err{color:var(--bad);font-size:14px;margin:6px 0 10px}
  .center{text-align:center}
  .small{font-size:14px}
  a{color:var(--accent-2)}
  [dir=rtl] h1{letter-spacing:0}
</style>
</head>

    b.onclick = goBack;
    app.appendChild(b);
  }

  function setProgress(done, total){
    progress.hidden = false;
    progress.firstElementChild.style.width = Math.round(done/total*100) + "%";
  }
  function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
  function clear(){ app.innerHTML=""; }

  // ======================= ЭКРАН: интро =======================
  function screenIntro(){
    current = screenIntro;
    clear(); progress.hidden = true;
    app.appendChild(el(
      '<div>'+
      '<span class="pill">'+L.intro_pill+'</span>'+
      '<h1>'+L.h1+'</h1>'+
      '<p class="lede">'+L.lede+'</p>'+
      '<p class="small">'+L.intro_small+'</p>'+
      '<div class="row"><button class="btn" id="start">'+L.start+'</button></div>'+
      '</div>'
    ));
    document.getElementById("start").onclick = screenContext;
  }

  // ======================= БЛОК A: контекст =======================
  function screenContext(){
    current = screenContext;
    var q = D.context[ctxIndex];
    setProgress(ctxIndex, D.context.length + E.DIAGNOSTIC_COUNT + 3);
    clear(); addBack();
    var card = el('<div class="card"><div class="pill">'+L.ctx_pill+' · '+(ctxIndex+1)+'/'+D.context.length+'</div>'+
      '<div class="q-prompt">'+t(q.prompt)+'</div><div class="opts"></div></div>');
    var opts = card.querySelector(".opts");
    q.options.forEach(function(o){
      var b = el('<button class="opt">'+t(o.label)+'</button>');
      b.onclick = function(){
        save(screenContext);
        session[q.key] = o.value;
        ctxIndex++;
        if(ctxIndex < D.context.length) screenContext();
        else startDiagnostic();
      };
      opts.appendChild(b);
    });
    app.appendChild(card);
  }

  // ======================= БЛОК B: диагностика =======================
  function startDiagnostic(){ E.setStartDifficulty(session); nextDiagnostic(); }

  function nextDiagnostic(){
    current = nextDiagnostic;
    if(E.isDiagnosticDone(session)){ startCando(); return; }
    var q = E.selectNext(session);
    if(!q){ startCando(); return; }
    var done = D.context.length + session.answers.length;
    setProgress(done, D.context.length + E.DIAGNOSTIC_COUNT + 3);
    clear(); addBack();

    var isListen = q.axis === "listening";
    var hint = q.hint && q.hint[LANG];
    var card = el('<div class="card">'+
      '<div class="pill">'+fill(fill(L.q_pill, "i", session.answers.length+1), "n", E.DIAGNOSTIC_COUNT)+'</div>'+
      (isListen ? '<div class="listen">'+L.listen+'</div><audio controls preload="none" src="'+(q.audio||'')+'"></audio>' : '')+
      '<div class="q-prompt" dir="ltr" lang="en">'+q.prompt+'</div>'+
      (hint ? '<button class="hint-btn" id="hint">'+L.hint_show+'</button><div class="hint" id="hinttext" hidden>'+hint+'</div>' : '')+
      '<div class="opts"></div>'+
      (isListen ? '<div style="margin-top:14px"><button class="btn btn-ghost" id="skip">'+L.skip+'</button></div>' : '')+
      '</div>');
    var opts = card.querySelector(".opts");
    q.options.forEach(function(text, i){
      var b = el('<button class="opt" dir="ltr" lang="en">'+text+'</button>');
      b.onclick = function(){ save(nextDiagnostic); E.recordAnswer(session, q, i, false); nextDiagnostic(); };
      opts.appendChild(b);
    });
    if(isListen){
      card.querySelector("#skip").onclick = function(){
        save(nextDiagnostic); E.recordAnswer(session, q, null, true); nextDiagnostic();
      };
    }
    if(hint){
      var hb = card.querySelector("#hint");
      hb.onclick = function(){
        var h = card.querySelector("#hinttext");
        h.hidden = !h.hidden;
        hb.textContent = h.hidden ? L.hint_show : L.hint_hide;
      };
    }
    app.appendChild(card);
  }

  // ======================= БЛОК C: can-do =======================
  function startCando(){
    candoList = E.pickCando(D, session.goal);
    candoIndex = 0;
    nextCando();
  }
  var SCORES = [0, 1, 2, 3];
  function nextCando(){
    current = nextCando;
    if(candoIndex >= candoList.length){ finish(); return; }
    var c = candoList[candoIndex];
    var done = D.context.length + E.DIAGNOSTIC_COUNT + candoIndex;
    setProgress(done, D.context.length + E.DIAGNOSTIC_COUNT + 3);
    clear(); addBack();
    var card = el('<div class="card">'+
      '<div class="pill">'+L.cando_pill+' · '+(candoIndex+1)+'/'+candoList.length+'</div>'+
      '<div class="q-prompt">'+t(c.text)+'</div><div class="scale"></div></div>');
    var scale = card.querySelector(".scale");
    SCORES.forEach(function(score){
      var b = el('<button class="opt">'+L.scale[score]+'</button>');
      b.onclick = function(){
        save(nextCando);
        // в таблицу преподавателю — по-русски, независимо от языка теста
        session.cando.push({id:c.id, text:c.text.ru, score:score, scoreLabel:UI.ru.scale[score]});
        candoIndex++; nextCando();
      };
      scale.appendChild(b);
    });
    app.appendChild(card);
  }

  // ======================= РЕЗУЛЬТАТ =======================
  function finish(){
    results = E.computeResults(session);
    setProgress(1,1);
    screenTeaser();
  }

  function axisBar(r){
    var m = D.axisMeta[r.axis];
    var pct = r.pct==null ? 0 : Math.round(r.pct*100);
    return '<div class="bar-row">'+
      '<div class="bar-label"><span>'+t(m.label)+'</span><span class="st">'+L.st[r.status]+'</span></div>'+
      '<div class="bar st-'+r.status+'"><i style="width:'+(r.status==="unchecked"?100:pct)+'%"></i></div>'+
      '</div>';
  }

  function screenTeaser(){
    current = screenTeaser;
    clear(); addBack();
    var weak = results.weakest;
    var verdict = weak ? t(D.axisMeta[weak.axis][weak.status]) : L.done;
    // строим профиль: слабейшую ось показываем открыто, остальное — под блюром
    var bars = results.axes.map(function(r){ return axisBar(r); }).join("");

    var deltaHtml = "";
    if(results.delta && !results.delta.match){
      deltaHtml = '<p class="small">'+fill(L.delta, "x", t(D.axisMeta[results.delta.factAxis].label))+'</p>';
    }

    app.appendChild(el(
      '<div>'+
      '<span class="pill">'+L.ready+'</span>'+
      '<div class="card">'+
        '<p class="verdict">'+verdict+'</p>'+
        deltaHtml+
        '<h2 style="margin-top:18px">'+L.profile+'</h2>'+
        '<div class="bars locked">'+
          '<div class="blur">'+bars+'</div>'+
          '<div class="lock-badge">'+L.lock+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="card">'+
        '<h2>'+L.open_h+'</h2>'+
        '<p>'+L.open_p+'</p>'+
        gateFormHtml()+
      '</div>'+
      '</div>'
    ));
    wireGateForm();
  }

  function gateFormHtml(){
    return '<form id="gate">'+
      '<div class="field"><label for="g-name">'+L.f_name+'</label>'+
        '<input id="g-name" type="text" autocomplete="name" placeholder="'+L.f_name_ph+'" /></div>'+
      '<div class="field"><label for="g-type">'+L.f_how+'</label>'+
        '<select id="g-type">'+
          '<option value="telegram">Telegram</option>'+
          '<option value="whatsapp">WhatsApp</option>'+
          '<option value="email">Email</option>'+
        '</select></div>'+
      '<div class="field"><label id="g-vlabel" for="g-value">'+L.ph.telegram[0]+'</label>'+
        '<input id="g-value" type="text" dir="ltr" placeholder="@username" /></div>'+
      '<div class="err" id="g-err" hidden></div>'+
      '<button class="btn" type="submit" id="g-submit">'+L.submit+'</button>'+
      '<p class="small" style="margin-top:12px">'+L.privacy+'</p>'+
    '</form>';
  }

  function wireGateForm(){
    var type = document.getElementById("g-type");
    var vlabel = document.getElementById("g-vlabel");
    var value = document.getElementById("g-value");
    type.onchange = function(){
      var p = L.ph[type.value];
      vlabel.textContent = p[0]; value.placeholder = p[1]; value.value="";
      value.type = type.value==="email" ? "email" : (type.value==="whatsapp"?"tel":"text");
    };
    document.getElementById("gate").onsubmit = function(ev){
      ev.preventDefault();
      var name = document.getElementById("g-name").value.trim();
      var tp = type.value, v = value.value.trim();
      var err = document.getElementById("g-err");
      if(!name){ return showErr(err, L.err_name); }
      if(!v){ return showErr(err, L.err_contact); }
      if(tp==="email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ return showErr(err, L.err_email); }
      err.hidden = true;
      submitContact({name:name, type:tp, value:v});
    };
  }
  function showErr(node,msg){ node.textContent=msg; node.hidden=false; return false; }

  function submitContact(contact){
    var btn = document.getElementById("g-submit");
    btn.disabled = true; btn.textContent = L.sending;
    var full = Object.assign({}, contact, meta);
    var payload = E.buildPayload(session, results, full);
    payload.answers_detail = E.buildDetail(session, D); // для листа Answers
    sendToSheets(payload).then(function(){
      screenFull();
    }).catch(function(e){
      // даже если запись не удалась — результат пользователю показываем
      console.error("Sheets error:", e);
      screenFull();
    });
  }

  // Результат уходит в два места: на сайт (кабинет Ксении + письмо, worker.mjs) и в Google-таблицу, как раньше.
  // Ошибка любого из них не мешает показать результат.
  function sendToSheets(payload){
    var body = JSON.stringify(payload);
    // api.bermanber.com — Cloudflare: сайт может лежать на другом хостинге (GitHub Pages, из-за ограничений в РФ).
    // text/plain — простой запрос без CORS preflight (и к сайту, и к Apps Script)
    var site = fetch("https://api.bermanber.com/api/result", {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: body});
    var sheets = CFG.SHEETS_ENDPOINT
      ? fetch(CFG.SHEETS_ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: body})
      : Promise.resolve();
    return Promise.allSettled([site, sheets]);
  }

  function screenFull(){
    current = screenFull;
    clear();
    var C = CFG.CONTACTS;
    var text = "?text=" + encodeURIComponent(fill(L.msg, "b", results.band));
    var bars = results.axes.map(function(r){ return axisBar(r); }).join("");
    var prioHtml = results.priorities.map(function(ax){
      var m = D.axisMeta[ax];
      return '<div class="prio"><b>'+t(m.label)+'.</b> '+t(m.fix)+'</div>';
    }).join("");
    var unchecked = results.axes.filter(function(r){ return r.status==="unchecked"; })
      .map(function(r){ return '<p class="small">'+t(D.axisMeta[r.axis].unchecked)+'</p>'; }).join("");
    var cta = t(D.goalCTA[results.goal] || D.goalCTA.general);

    app.appendChild(el(
      '<div>'+
      '<span class="pill">'+fill(L.full_pill, "b", '<bdi dir="ltr">'+results.band+'</bdi>')+'</span>'+
      '<div class="card">'+
        '<h2>'+L.profile+'</h2>'+
        '<div class="bars">'+bars+'</div>'+
        unchecked+
      '</div>'+
      '<div class="card">'+
        '<h2>'+L.fix_h+'</h2>'+
        (prioHtml || '<p>'+L.no_weak+'</p>')+
      '</div>'+
      '<div class="card center">'+
        '<h2>'+L.free_h+'</h2>'+
        '<p>'+cta+'</p>'+
        '<div class="row" style="justify-content:center">'+
          '<a class="btn btn-wa" href="'+C.whatsapp+text+'" target="_blank" rel="noopener">'+L.wa_btn+'</a>'+
          '<a class="btn btn-tg" href="'+C.telegram+text+'" target="_blank" rel="noopener">'+L.tg_btn+'</a>'+
        '</div>'+
        '<p class="small" style="margin-top:16px">'+L.more+' '+
          '<a href="'+C.site+(LANG === "ru" ? "" : "?lang="+LANG)+'">'+L.site+'</a> · '+
          '<a href="'+C.threads+'" target="_blank" rel="noopener">Threads</a></p>'+
      '</div>'+
      '</div>'
    ));
    window.scrollTo(0,0);
  }

  // старт
  applyLang();
  screenIntro();
})();
</script>
</body>
</html>
