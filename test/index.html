  /* Цвета — как на основном сайте (../index.html) */
  :root{
    --bg:#f7f3ec; --panel:#fff; --panel-2:#f4efe6; --line:#e3dacb;
    --ink:#15262d; --muted:#56676e; --accent:#1d4b57; --accent-2:#2f6b78; --warm:#e9774c;
    --good:#2f9e6e; --mid:#e0a332; --bad:#e06a4f; --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .top{position:sticky;top:0;z-index:5;background:rgba(247,243,236,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top .in{max-width:640px;margin:0 auto;padding:0 18px;height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .home{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
  .home i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-style:normal;font-size:12px}
  .lang{display:flex;background:var(--panel-2);border-radius:999px;padding:3px}
  .lang button{border:0;background:none;font:600 13px Rubik,sans-serif;color:var(--muted);padding:6px 11px;border-radius:999px;cursor:pointer}
  .lang button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 64px}
  h1{font-size:30px;line-height:1.2;margin:0 0 12px;letter-spacing:-.01em}
  h2{font-size:20px;margin:0 0 10px}
  p{margin:0 0 14px;color:var(--muted)}
  .lede{color:var(--ink);font-size:18px}
  .card{background:var(--panel);border-radius:var(--radius);padding:24px;margin:0 0 16px;box-shadow:0 8px 26px rgba(21,38,45,.07)}
  .pill{display:inline-block;font-size:13px;font-weight:500;color:var(--accent-2);background:#e3eef0;
    border-radius:999px;padding:4px 12px;margin-bottom:14px}
  .q-prompt{font-size:19px;font-weight:500;color:var(--ink);margin:2px 0 16px;line-height:1.4}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:block;width:100%;text-align:start;background:var(--panel-2);
    border:2px solid transparent;color:var(--ink);border-radius:14px;padding:14px 16px;
    font:16px Rubik,sans-serif;cursor:pointer;transition:.12s border-color,.12s background}
  .opt:hover{border-color:var(--accent-2);background:#fff}
  .opt:active{background:#e3eef0}
  .opt-dk{background:transparent;border:2px dashed var(--line);color:var(--muted)}
  .opt-dk:hover{background:transparent}
  .btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:999px;
    padding:14px 24px;font:600 16px Rubik,sans-serif;cursor:pointer;transition:.12s background;text-decoration:none}
  .btn:hover{background:var(--accent-2)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:transparent;border:2px solid var(--line);color:var(--muted);font-weight:500}
  .btn-ghost:hover{background:transparent;border-color:var(--accent-2);color:var(--ink)}
  .btn-wa{background:#1fa855}
  .btn-wa:hover{background:#178f47}
  .btn-tg{background:#2a9fd8}
  .btn-tg:hover{background:#1f8bc0}
  .back{background:none;border:0;color:var(--muted);font:500 15px Rubik,sans-serif;cursor:pointer;padding:4px 0;margin:0 0 10px}
  .back:hover{color:var(--ink)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:0 0 22px}
  .progress > i{display:block;height:100%;background:var(--warm);width:0;transition:.25s width}
  .scale{display:flex;gap:8px;flex-wrap:wrap}
  .scale .opt{flex:1;min-width:120px;text-align:center}
  .listen{font-size:14px;font-weight:600;color:var(--accent-2);margin:0 0 4px}
  audio{width:100%;margin:6px 0 14px}
  .hint-btn{background:none;border:none;color:var(--accent-2);font:500 14px Rubik,sans-serif;cursor:pointer;padding:0;margin:0 0 12px;display:inline-block;text-decoration:underline}
  .rec-on{display:flex;align-items:center;gap:8px;color:var(--bad);font-weight:500;margin:0 0 12px}
  .rec-on i{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){.rec-on i{animation:none}}
  .hint{background:#fdf3ec;border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:15px;color:var(--ink);line-height:1.45}
  /* результат */
  .bars{display:flex;flex-direction:column;gap:12px;margin:6px 0 4px}
  .bar-row{display:grid;grid-template-columns:1fr;gap:6px}
  .bar-label{display:flex;justify-content:space-between;font-size:15px}
  .bar-label .st{color:var(--muted)}
  .bar{height:10px;background:var(--panel-2);border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:999px}
  .st-strong > i{background:var(--good)} .st-medium > i{background:var(--mid)}
  .st-weak > i{background:var(--bad)}  .st-unchecked > i{background:#d9d1c3}
  .locked{position:relative}
  .locked .blur{filter:blur(6px);opacity:.6;pointer-events:none;user-select:none}
  .lock-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:500;color:var(--ink)}
  .verdict{font-size:20px;font-weight:500;color:var(--ink);line-height:1.4;margin:0 0 8px}
  .field{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
  .field label{font-size:14px;color:var(--muted)}
  input,select{background:var(--panel-2);border:2px solid transparent;color:var(--ink);
    border-radius:12px;padding:12px 14px;font:16px Rubik,sans-serif;width:100%}
  input:focus,select:focus{outline:none;border-color:var(--accent-2);background:#fff}
  .prio{background:var(--panel-2);border-radius:12px;padding:14px 16px;margin:0 0 10px}
  .prio b{color:var(--ink)}
  .err{color:var(--bad);font-size:14px;margin:6px 0 10px}
  .center{text-align:center}
  .small{font-size:14px}
  a{color:var(--accent-2)}
  [dir=rtl] h1{letter-spacing:0}
</style>

      tg_btn: "לכתוב בטלגרם", wa_btn: "לכתוב בוואטסאפ",
      more: "עוד עליי:", site: "האתר",
      msg: "שלום! עשיתי את מבחן הרמה, התוצאה ≈ {b}. אשמח לשיחת הניתוח החינמית."
    }
  };

  // ---- язык: ?lang= из адреса, иначе выбор на сайте (общий localStorage), иначе ru ----
  var params = new URLSearchParams(location.search);
  var saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  var LANG = UI[params.get("lang")] ? params.get("lang") : (UI[saved] ? saved : "ru");
  var L = UI[LANG];
  function t(x){ return x && typeof x === "object" ? (x[LANG] || x.ru) : x; }  // { ru, en, he } -> строка
  function fill(s, k, v){ return s.replace("{" + k + "}", v); }

  // ---- Google Analytics: шаги теста (gtag — из /ga.js). Локально не шлём, только в консоль ----
  var LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  function track(name, params){
    if(LOCAL || !window.gtag){ console.log("ga:", name, params || {}); return; }
    gtag("event", name, params || {});
  }
  var tracked = {}; // шаги воронки — один раз за прохождение, даже если ходили «Назад»
  function trackOnce(name, params){ if(!tracked[name]){ tracked[name] = 1; track(name, params); } }
  var current = null; // текущий экран — перерисовываем его при смене языка

  function applyLang(){
    L = UI[LANG];
    session.lang = LANG;
    document.documentElement.lang = LANG;
    document.documentElement.dir = LANG === "he" ? "rtl" : "ltr";
    document.title = L.title;
    document.querySelector("meta[name=description]").content = L.desc;
    document.getElementById("home-name").textContent = L.name;
    document.getElementById("home").href = "../" + (LANG === "ru" ? "" : "?lang=" + LANG);
    document.querySelectorAll("[data-lang]").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.lang === LANG); });
  }
  document.querySelectorAll("[data-lang]").forEach(function(b){
    b.onclick = function(){
      LANG = b.dataset.lang;
      try { localStorage.setItem("lang", LANG); } catch (e) {}
      var p = new URLSearchParams(location.search);
      if (LANG === "ru") p.delete("lang"); else p.set("lang", LANG);
      history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p : ""));
      applyLang();
      if (current) current();
    };
  });

  // ---- utm / реферер из URL ----
  var meta = {
    utm_source: params.get("utm_source") || "",
    utm_medium: params.get("utm_medium") || "",
    utm_campaign: params.get("utm_campaign") || "",
    referrer: document.referrer || "",
    user_agent: navigator.userAgent || ""
  };

  // всего шагов для полосы прогресса: контекст, база, диагностика, устная часть, can-do
  var TOTAL = D.context.length + D.basics.length + E.DIAGNOSTIC_COUNT + D.speaking.length + 3;
  var QN = D.basics.length + E.DIAGNOSTIC_COUNT; // вопросов с вариантами — сквозная нумерация «Вопрос i из n»
  var ctxIndex = 0;   // индекс текущего контекстного вопроса
  var spIndex = 0, spStart = 0; // устная часть: текущий вопрос и с какого начали
  var candoList = []; // выбранные can-do
  var candoIndex = 0;

  // ---- «Назад»: перед каждым ответом запоминаем состояние, кнопка его восстанавливает ----
  var steps = [];
  var SESSION_KEYS = ["level", "goal", "situation", "self_weak", "difficulty", "asked", "basics", "answers", "block", "axisCount", "speaking", "cando"];
  function save(screen){
    var st = {};
    SESSION_KEYS.forEach(function(k){ st[k] = session[k]; });
    steps.push({s: JSON.stringify(st), ctxIndex: ctxIndex, spIndex: spIndex, spStart: spStart, candoIndex: candoIndex, candoList: candoList.slice(), screen: screen});
  }
  function goBack(){
    stopRec(false);
    var st = steps.pop();
    if(!st){ ctxIndex = 0; screenIntro(); return; }
    Object.assign(session, JSON.parse(st.s));
    ctxIndex = st.ctxIndex; spIndex = st.spIndex; spStart = st.spStart; candoIndex = st.candoIndex; candoList = st.candoList;
    st.screen();
  }
  function addBack(){
    var b = el('<button class="back" type="button">'+L.back+'</button>');
    b.onclick = goBack;
    app.appendChild(b);
  }

  function setProgress(done, total){
    progress.hidden = false;
    progress.firstElementChild.style.width = Math.round(done/total*100) + "%";
  }
  function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
  function clear(){ app.innerHTML=""; }

  // ======================= ЭКРАН: интро =======================
  function screenIntro(){
    current = screenIntro;
    clear(); progress.hidden = true;
    app.appendChild(el(
      '<div>'+
      '<span class="pill">'+L.intro_pill+'</span>'+
      '<h1>'+L.h1+'</h1>'+
      '<p class="lede">'+L.lede+'</p>'+
      '<p class="small">'+L.intro_small+'</p>'+
      '<div class="row"><button class="btn" id="start">'+L.start+'</button></div>'+
      '</div>'
    ));
    document.getElementById("start").onclick = function(){ trackOnce("test_start", {test_lang: LANG}); screenContext(); };
  }

  // ======================= БЛОК A: контекст =======================
  function screenContext(){
    current = screenContext;
    var q = D.context[ctxIndex];
    setProgress(ctxIndex, TOTAL);
    clear(); addBack();
    var card = el('<div class="card"><div class="pill">'+L.ctx_pill+' · '+(ctxIndex+1)+'/'+D.context.length+'</div>'+
      '<div class="q-prompt">'+t(q.prompt)+'</div><div class="opts"></div></div>');
    var opts = card.querySelector(".opts");
    q.options.forEach(function(o){
      var b = el('<button class="opt">'+t(o.label)+'</button>');
      b.onclick = function(){
        save(screenContext);
        session[q.key] = o.value;
        ctxIndex++;
        if(ctxIndex < D.context.length) screenContext();
        else nextBasic();
      };
      opts.appendChild(b);
    });
    app.appendChild(card);
  }

  // ======================= БАЗА: базовая грамматика (всем, без адаптации) =======================
  function nextBasic(){
    current = nextBasic;
    var i = session.basics.length;
    if(i >= D.basics.length){ trackOnce("test_basics_done"); startDiagnostic(); return; }
    var q = D.basics[i];
    setProgress(D.context.length + i, TOTAL);
    questionCard(q, i + 1, function(chosen){ save(nextBasic); E.recordBasic(session, q, chosen); nextBasic(); });
  }

  // ======================= БЛОК B: диагностика =======================
  function startDiagnostic(){ E.setStartDifficulty(session); nextDiagnostic(); }

  function nextDiagnostic(){
    current = nextDiagnostic;
    if(E.isDiagnosticDone(session)){ startSpeaking(); return; }
    var q = E.selectNext(session);
    if(!q){ startSpeaking(); return; }
    setProgress(D.context.length + D.basics.length + session.answers.length, TOTAL);
    questionCard(q, D.basics.length + session.answers.length + 1, function(chosen, skipped){
      save(nextDiagnostic); E.recordAnswer(session, q, chosen, skipped); nextDiagnostic();
    });
  }

  // кнопка «Не понимаю вопрос» с переводом формулировки
  function hintHtml(q){
    var hint = q.hint && q.hint[LANG];
    return hint ? '<button class="hint-btn" id="hint">'+L.hint_show+'</button><div class="hint" id="hinttext" hidden>'+hint+'</div>' : '';
  }
  function wireHint(card){
    var hb = card.querySelector("#hint");
    if(!hb) return;
    hb.onclick = function(){
      var h = card.querySelector("#hinttext");
      h.hidden = !h.hidden;
      hb.textContent = h.hidden ? L.hint_show : L.hint_hide;
    };
  }

  // карточка вопроса с вариантами; onAnswer(индекс варианта | null, пропуск listening)
  function questionCard(q, num, onAnswer){
    clear(); addBack();
    var isListen = q.axis === "listening";
    var card = el('<div class="card">'+
      '<div class="pill">'+fill(fill(L.q_pill, "i", num), "n", QN)+'</div>'+
      (isListen ? '<div class="listen">'+L.listen+'</div><audio controls preload="none" src="'+(q.audio||'')+'"></audio>' : '')+
      '<div class="q-prompt" dir="ltr" lang="en">'+q.prompt+'</div>'+
      hintHtml(q)+
      '<div class="opts"></div>'+
      (isListen ? '<div style="margin-top:14px"><button class="btn btn-ghost" id="skip">'+L.skip+'</button></div>' : '')+
      '</div>');
    var opts = card.querySelector(".opts");
    q.options.forEach(function(text, i){
      var b = el('<button class="opt" dir="ltr" lang="en">'+text+'</button>');
      b.onclick = function(){ onAnswer(i, false); };
      opts.appendChild(b);
    });
    // «Не знаю» — чтобы не тыкали наугад; считается неверным ответом
    var dk = el('<button class="opt opt-dk">'+L.dont_know+'</button>');
    dk.onclick = function(){ onAnswer(null, false); };
    opts.appendChild(dk);
    if(isListen) card.querySelector("#skip").onclick = function(){ onAnswer(null, true); };
    wireHint(card);
    app.appendChild(card);
  }

  // ======================= УСТНАЯ ЧАСТЬ: ответы голосом =======================
  // Запись остаётся в браузере до отправки контактов; тогда уходит на api.bermanber.com/api/audio.
  var audioBlobs = {}; // id вопроса -> {blob, url, ext}; в снимки «Назад» не попадают
  var rec = null;      // идущая запись
  var REC_MAX = 90;    // секунд на ответ, потом запись останавливается сама
  function mmss(sec){ return Math.floor(sec/60) + ":" + ("0" + sec%60).slice(-2); }

  function startSpeaking(){ trackOnce("test_diagnostic_done"); spIndex = spStart = E.speakingStart(session); nextSpeaking(); }

  function nextSpeaking(){
    current = nextSpeaking;
    stopRec(false);
    if(spIndex >= D.speaking.length){ startCando(); return; }
    var q = D.speaking[spIndex];
    setProgress(D.context.length + QN + spIndex, TOTAL);
    clear(); addBack();
    var card = el('<div class="card">'+
      '<div class="pill">'+L.sp_pill+' · '+(spIndex-spStart+1)+'/'+(D.speaking.length-spStart)+'</div>'+
      '<p class="small">'+L.sp_intro+'</p>'+
      '<div class="q-prompt" dir="ltr" lang="en">'+q.prompt+'</div>'+
      hintHtml(q)+
      '<div id="rec"></div>'+
      '<div style="margin-top:14px"><button class="btn btn-ghost" id="sp-skip">'+L.sp_skip+'</button></div>'+
      '</div>');
    wireHint(card);
    card.querySelector("#sp-skip").onclick = function(){ answerSpeaking(q, "skipped"); };
    app.appendChild(card);
    renderRec(card.querySelector("#rec"), q);
  }

  function answerSpeaking(q, status){
    save(nextSpeaking);
    stopRec(false);
    session.speaking.push({id: q.id, prompt: q.prompt, status: status});
    track("speaking_answer", {action: status});
    spIndex++; nextSpeaking();
  }

  // три состояния: нет записи → идёт запись → есть запись (прослушать, перезаписать, дальше)
  function renderRec(box, q, msg){
    var a = audioBlobs[q.id];
    box.innerHTML = rec
      ? '<p class="rec-on"><i></i>'+L.sp_recording+' <b id="rec-t">0:00</b> / '+mmss(REC_MAX)+'</p><button class="btn" id="rec-stop">'+L.sp_stop+'</button>'
      : a
      ? '<audio controls src="'+a.url+'"></audio><div class="row"><button class="btn" id="rec-next">'+L.sp_next+'</button><button class="btn btn-ghost" id="rec-start">'+L.sp_again+'</button></div>'
      : (msg ? '<p class="err">'+msg+'</p>' : '')+'<button class="btn" id="rec-start">'+L.sp_record+'</button>';
    var start = box.querySelector("#rec-start"), stop = box.querySelector("#rec-stop"), next = box.querySelector("#rec-next");
    if(start) start.onclick = function(){ start.disabled = true; startRec(box, q); };
    if(stop) stop.onclick = function(){ stopRec(true); };
    if(next) next.onclick = function(){ answerSpeaking(q, "recorded"); };
  }

  function startRec(box, q){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ track("mic_error", {error: "unsupported"}); renderRec(box, q, L.sp_nomic); return; }
    navigator.mediaDevices.getUserMedia({audio: true}).then(function(stream){
      if(!box.isConnected){ stream.getTracks().forEach(function(t){ t.stop(); }); return; } // ушли с экрана, пока браузер спрашивал
      // Chrome/Firefox пишут webm (opus), Safari — mp4 (aac). 32 кбит/с: 1,5 минуты ≈ 360 КБ
      var type = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg;codecs=opus"].filter(function(t){ return MediaRecorder.isTypeSupported(t); })[0];
      var opts = {audioBitsPerSecond: 32000};
      if(type) opts.mimeType = type;
      var mr = new MediaRecorder(stream, opts), chunks = [], t0 = Date.now();
      var r = rec = {mr: mr, stream: stream, keep: false};
      mr.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = function(){
        if(!r.keep) return;
        if(chunks.length){
          var mime = mr.mimeType || type || "audio/webm";
          if(audioBlobs[q.id]) URL.revokeObjectURL(audioBlobs[q.id].url);
          var blob = new Blob(chunks, {type: mime});
          audioBlobs[q.id] = {blob: blob, url: URL.createObjectURL(blob), ext: /mp4|aac/.test(mime) ? "mp4" : /ogg/.test(mime) ? "ogg" : "webm"};
        }
        if(box.isConnected) renderRec(box, q);
      };
      r.timer = setInterval(function(){
        var sec = Math.round((Date.now() - t0) / 1000);
        var te = document.getElementById("rec-t");
        if(te) te.textContent = mmss(Math.min(sec, REC_MAX));
        if(sec >= REC_MAX) stopRec(true);
      }, 500);
      mr.start();
      renderRec(box, q);
    }).catch(function(e){ track("mic_error", {error: e && e.name || ""}); if(box.isConnected) renderRec(box, q, L.sp_nomic); });
  }

  // keep=false — запись выбрасываем (ушли с экрана, сменили язык, пропустили)
  function stopRec(keep){
    if(!rec) return;
    var r = rec; rec = null;
    r.keep = keep;
    clearInterval(r.timer);
    if(r.mr.state !== "inactive") r.mr.stop();
    r.stream.getTracks().forEach(function(t){ t.stop(); });
  }

  // отправить записи; у каждой — id (key) или пустая строка, если не дошла.
  // Сначала Cloudflare; не ответил за 20 с или ошибка (так бывает из РФ) — Google Диск через Apps Script, id с приставкой "g:".
  function uploadAudio(){
    return Promise.all(session.speaking.map(function(sp){
      var a = audioBlobs[sp.id];
      if(sp.status !== "recorded" || !a) return null;
      // text/plain — простой запрос без CORS preflight; настоящий тип записи — в ?t=
      return postJson("https://api.bermanber.com/api/audio?t=" + a.ext, a.blob, 20000)
        .then(function(j){ track("audio_upload", {route: "cloudflare"}); return j.id; })
        .catch(function(e){
          console.error("audio upload (cloudflare):", e);
          if(!CFG.DRIVE_AUDIO) throw e;
          return toBase64(a.blob).then(function(data){
            return postJson(CFG.DRIVE_AUDIO, JSON.stringify({type: a.ext, data: data}), 60000);
          }).then(function(j){ track("audio_upload", {route: "drive"}); return "g:" + j.id; });
        })
        .then(function(id){ sp.key = id; },
              function(e){ console.error("audio upload:", e); track("audio_upload", {route: "failed"}); sp.key = ""; });
    }));
  }
  // POST с таймаутом; успех — только ответ {ok: true, id}
  function postJson(url, body, ms){
    var ctl = window.AbortController ? new AbortController() : null;
    var tm = ctl && setTimeout(function(){ ctl.abort(); }, ms);
    return fetch(url, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: body, signal: ctl ? ctl.signal : undefined})
      .then(function(res){ return res.json(); })
      .then(function(j){ clearTimeout(tm); if(!j || !j.ok || !j.id) throw new Error("upload: " + JSON.stringify(j)); return j; },
            function(e){ clearTimeout(tm); throw e; });
  }
  function toBase64(blob){
    return new Promise(function(ok, fail){
      var r = new FileReader();
      r.onload = function(){ ok(String(r.result).split(",")[1] || ""); };
      r.onerror = fail;
      r.readAsDataURL(blob);
    });
  }

  // ======================= БЛОК C: can-do =======================
  function startCando(){
    trackOnce("test_speaking_done", {recorded: session.speaking.filter(function(sp){ return sp.status === "recorded"; }).length});
    candoList = E.pickCando(D, session.goal);
    candoIndex = 0;
    nextCando();
  }
  var SCORES = [0, 1, 2, 3];
  function nextCando(){
    current = nextCando;
    if(candoIndex >= candoList.length){ finish(); return; }
    var c = candoList[candoIndex];
    setProgress(TOTAL - 3 + candoIndex, TOTAL);
    clear(); addBack();
    var card = el('<div class="card">'+
      '<div class="pill">'+L.cando_pill+' · '+(candoIndex+1)+'/'+candoList.length+'</div>'+
      '<div class="q-prompt">'+t(c.text)+'</div><div class="scale"></div></div>');
    var scale = card.querySelector(".scale");
    SCORES.forEach(function(score){
      var b = el('<button class="opt">'+L.scale[score]+'</button>');
      b.onclick = function(){
        save(nextCando);
        // в таблицу преподавателю — по-русски, независимо от языка теста
        session.cando.push({id:c.id, text:c.text.ru, score:score, scoreLabel:UI.ru.scale[score]});
        candoIndex++; nextCando();
      };
      scale.appendChild(b);
    });
    app.appendChild(card);
  }

  // ======================= РЕЗУЛЬТАТ =======================
  function finish(){
    results = E.computeResults(session);
    trackOnce("test_complete", {band: results.band});
    setProgress(1,1);
    screenTeaser();
  }

  function axisBar(r){
    var m = D.axisMeta[r.axis];
    var pct = r.pct==null ? 0 : Math.round(r.pct*100);
    return '<div class="bar-row">'+
      '<div class="bar-label"><span>'+t(m.label)+'</span><span class="st">'+L.st[r.status]+'</span></div>'+
      '<div class="bar st-'+r.status+'"><i style="width:'+(r.status==="unchecked"?100:pct)+'%"></i></div>'+
      '</div>';
  }

  function screenTeaser(){
    current = screenTeaser;
    clear(); addBack();
    var weak = results.weakest;
    var verdict = weak ? t(D.axisMeta[weak.axis][weak.status]) : L.done;
    // строим профиль: слабейшую ось показываем открыто, остальное — под блюром
    var bars = results.axes.map(function(r){ return axisBar(r); }).join("");

    var deltaHtml = "";
    if(results.delta && !results.delta.match){
      deltaHtml = '<p class="small">'+fill(L.delta, "x", t(D.axisMeta[results.delta.factAxis].label))+'</p>';
    }

    app.appendChild(el(
      '<div>'+
      '<span class="pill">'+L.ready+'</span>'+
      '<div class="card">'+
        '<p class="verdict">'+verdict+'</p>'+
        deltaHtml+
        '<h2 style="margin-top:18px">'+L.profile+'</h2>'+
        '<div class="bars locked">'+
          '<div class="blur">'+bars+'</div>'+
          '<div class="lock-badge">'+L.lock+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="card">'+
        '<h2>'+L.open_h+'</h2>'+
        '<p>'+L.open_p+'</p>'+
        gateFormHtml()+
      '</div>'+
      '</div>'
    ));
    wireGateForm();
  }

  function gateFormHtml(){
    return '<form id="gate">'+
      '<div class="field"><label for="g-name">'+L.f_name+'</label>'+
        '<input id="g-name" type="text" autocomplete="name" placeholder="'+L.f_name_ph+'" /></div>'+
      '<div class="field"><label for="g-type">'+L.f_how+'</label>'+
        '<select id="g-type">'+
          '<option value="telegram">Telegram</option>'+
          '<option value="whatsapp">WhatsApp</option>'+
          '<option value="email">Email</option>'+
        '</select></div>'+
      '<div class="field"><label id="g-vlabel" for="g-value">'+L.ph.telegram[0]+'</label>'+
        '<input id="g-value" type="text" dir="ltr" placeholder="@username" /></div>'+
      '<div class="err" id="g-err" hidden></div>'+
      '<button class="btn" type="submit" id="g-submit">'+L.submit+'</button>'+
      '<p class="small" style="margin-top:12px">'+L.privacy+'</p>'+
    '</form>';
  }

  function wireGateForm(){
    var type = document.getElementById("g-type");
    var vlabel = document.getElementById("g-vlabel");
    var value = document.getElementById("g-value");
    type.onchange = function(){
      var p = L.ph[type.value];
      vlabel.textContent = p[0]; value.placeholder = p[1]; value.value="";
      value.type = type.value==="email" ? "email" : (type.value==="whatsapp"?"tel":"text");
    };
    document.getElementById("gate").onsubmit = function(ev){
      ev.preventDefault();
      var name = document.getElementById("g-name").value.trim();
      var tp = type.value, v = value.value.trim();
      var err = document.getElementById("g-err");
      if(!name){ return showErr(err, L.err_name); }
      if(!v){ return showErr(err, L.err_contact); }
      if(tp==="email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ return showErr(err, L.err_email); }
      err.hidden = true;
      submitContact({name:name, type:tp, value:v});
    };
  }
  function showErr(node,msg){ node.textContent=msg; node.hidden=false; return false; }

  function submitContact(contact){
    var btn = document.getElementById("g-submit");
    btn.disabled = true;
    trackOnce("generate_lead", {band: results.band, contact_type: contact.type}); // без имени и контакта
    btn.textContent = session.speaking.some(function(sp){ return sp.status === "recorded"; }) ? L.sending_audio : L.sending;
    var full = Object.assign({}, contact, meta);
    uploadAudio().then(function(){
      var payload = E.buildPayload(session, results, full);
      payload.answers_detail = E.buildDetail(session, D); // для листа Answers; у устных ответов — audio (id записи)
      return sendToSheets(payload);
    }).then(function(){
      screenFull();
    }).catch(function(e){
      // даже если запись не удалась — результат пользователю показываем
      console.error("Sheets error:", e);
      screenFull();
    });
  }

  // Результат уходит в два места: на сайт (кабинет Ксении + письмо, worker.mjs) и в Google-таблицу, как раньше.
  // Ошибка любого из них не мешает показать результат.
  function sendToSheets(payload){
    var body = JSON.stringify(payload);
    // api.bermanber.com — Cloudflare: сайт может лежать на другом хостинге (GitHub Pages, из-за ограничений в РФ).
    // text/plain — простой запрос без CORS preflight (и к сайту, и к Apps Script)
    var site = fetch("https://api.bermanber.com/api/result", {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: body});
    var sheets = CFG.SHEETS_ENDPOINT
      ? fetch(CFG.SHEETS_ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: body})
      : Promise.resolve();
    return Promise.allSettled([site, sheets]);
  }

  function screenFull(){
    current = screenFull;
    clear();
    var C = CFG.CONTACTS;
    var text = "?text=" + encodeURIComponent(fill(L.msg, "b", results.band));
    var bars = results.axes.map(function(r){ return axisBar(r); }).join("");
    var prioHtml = results.priorities.map(function(ax){
      var m = D.axisMeta[ax];
      return '<div class="prio"><b>'+t(m.label)+'.</b> '+t(m.fix)+'</div>';
    }).join("");
    var unchecked = results.axes.filter(function(r){ return r.status==="unchecked"; })
      .map(function(r){ return '<p class="small">'+t(D.axisMeta[r.axis].unchecked)+'</p>'; }).join("");
    var cta = t(D.goalCTA[results.goal] || D.goalCTA.general);

    app.appendChild(el(
      '<div>'+
      '<span class="pill">'+fill(L.full_pill, "b", '<bdi dir="ltr">'+results.band+'</bdi>')+'</span>'+
      '<div class="card">'+
        '<h2>'+L.profile+'</h2>'+
        '<div class="bars">'+bars+'</div>'+
        unchecked+
      '</div>'+
      '<div class="card">'+
        '<h2>'+L.fix_h+'</h2>'+
        (prioHtml || '<p>'+L.no_weak+'</p>')+
      '</div>'+
      '<div class="card center">'+
        '<h2>'+L.free_h+'</h2>'+
        '<p>'+cta+'</p>'+
        '<div class="row" style="justify-content:center">'+
          '<a class="btn btn-wa" href="'+C.whatsapp+text+'" target="_blank" rel="noopener">'+L.wa_btn+'</a>'+
          '<a class="btn btn-tg" href="'+C.telegram+text+'" target="_blank" rel="noopener">'+L.tg_btn+'</a>'+
        '</div>'+
        '<p class="small" style="margin-top:16px">'+L.more+' '+
          '<a href="'+C.site+(LANG === "ru" ? "" : "?lang="+LANG)+'">'+L.site+'</a> · '+
          '<a href="'+C.threads+'" target="_blank" rel="noopener">Threads</a></p>'+
      '</div>'+
      '</div>'
    ));
    window.scrollTo(0,0);
  }

  // старт
  applyLang();
  screenIntro();
})();
</script>
</body>
</html>
